# audible league config -- League B (ESPN)
# Davis Drive Alumni FF League (league_id 6012, legacy/private).
#
# IMPORTANT: target scoring is HALF-PPR (rec = 0.5), but the live ESPN league is
# still set to STANDARD (0 PPR) and will be flipped this season. The ESPN adapter
# verifies live scoring_format (statId 53 = REC) against `expected_reception_points`
# and screams loudly on mismatch rather than silently trusting live values.
#
# Scoring keys use the Sleeper stat vocabulary for one shared scoring engine; they
# will be reconciled against ESPN's live scoring_format when the adapter lands (Phase 1).

key = "espn_davis_drive"
name = "Davis Drive Alumni FF League"
platform = "espn"
league_id = "6012"
season = 2026
num_teams = 8

# Starting lineup (9). 1-QB, no IDP, team D/ST only (normalized to DEF internally).
starting_slots = ["QB", "RB", "RB", "WR", "WR", "TE", "FLEX", "DEF", "K"]

# 16 rounds against 9 starting slots -> 7 bench picks per team. Replacement level is the
# first player on the WAIVER WIRE, and 56 of the 128 players drafted here are bench, so
# they are not on it. Priced in, League B's baselines move from RB17/WR25 to RB35/WR52 and
# stay at D/ST9 and K9 -- nobody drafts a backup D/ST. Left at 0 the board ranked the top
# D/ST 33rd overall and made D/ST and K its eleven biggest "value" targets.
#
# Checked against ADP, the only ground truth for how many of each position get drafted: the
# market's first 128 picks are 43 RB / 53 WR / 16 QB / 16 TE and ZERO D/ST or K (first D/ST
# at 132, first K at 131). This lands on the same shape.
# 16 rounds, agreeing two ways against the live league: max(roundId) over the draft slate,
# and sum(lineupSlotCounts) - IR. Sync overrides this; it is what the clock uses before the
# first successful poll.
draft_rounds = 16

replacement_bench_slots = 7

expected_reception_points = 0.5  # drift guard: the WR/TE reception value (see [scoring_by_position])
notes = "Shallow 8-team, 16-round, 1-QB. Half-PPR for WR/TE, ZERO PPR for RB -- deliberate."
# Backtest edged scarcity/VONA over VORP here (+28 vs +24), BUT the current VONA impl has a
# junk-tail pathology on flat positions (inflates mid-QB value -> QB-dominated board). Until
# it's reimplemented replacement-bounded, ship on VORP (robust). Tracked as a known issue.
value_metric = "vorp"

# Sleeper ADP market used to price this league: 1-QB, half-PPR, no IDP.
adp_market = "adp_half_ppr"

[slot_eligibility]
QB = ["QB"]
RB = ["RB"]
WR = ["WR"]
TE = ["TE"]
FLEX = ["RB", "WR", "TE"]
DEF = ["DEF"]
K = ["K"]

# Target half-PPR scoring (ESPN defaults + half-PPR reception).
[scoring]
pass_yd = 0.04
pass_td = 4
pass_int = -2
pass_2pt = 2
rush_yd = 0.1
rush_td = 6
rush_2pt = 2
rec = 0.5          # base; RB is overridden to 0.0 below
rec_yd = 0.1
rec_td = 6
rec_2pt = 2
fum_lost = -2
# Kicker (ESPN tiered makes; distance-based)
fgm_0_19 = 3
fgm_20_29 = 3
fgm_30_39 = 3
fgm_40_49 = 4
fgm_50p = 5
xpm = 1
fgmiss = -1
# Team D/ST
sack = 1
int = 2
fum_rec = 2
def_td = 6
safe = 2
blk_kick = 2
pts_allow_0 = 5
pts_allow_1_6 = 4
pts_allow_7_13 = 3
pts_allow_14_20 = 1
pts_allow_28_34 = -1
pts_allow_35p = -4

# Per-position overrides layered on [scoring]. A position listed here takes the override;
# anything not listed falls back to the base weight above.
#
# DELIBERATE, CONFIRMED BY THE COMMISSIONER 2026-08-17: running backs score ZERO per
# reception while WR and TE score 0.5. This is not drift and must not be "fixed" -- an
# earlier handoff flagged it as a possible commissioner slip and it is not one.
#
# Verified against the live API the same day: statId 53 (REC) carries points 0.0 with
# pointsOverrides {QB: 0.5, WR: 0.5, TE: 0.5}, RB absent. Recomputing 2025 actual stat lines
# under this model matched ESPN's own reported season totals to the decimal for 18 of 18
# players spanning QB/RB/WR/TE/K/D-ST.
#
# Worth ~30 points a season on a pass-catching back, which is enough to reorder RB vs WR.
[scoring_by_position]
RB = { rec = 0.0 }
