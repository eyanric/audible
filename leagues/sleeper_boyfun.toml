# audible league config -- League A (Sleeper)
# Scoring captured from the LIVE league 2026-06-26 (re-verified faithful 2026-08-15, 72/72 keys).
# Roster structure re-captured 2026-08-15 after the committed version was found to disagree
# with the live league; run `audible verify-scoring <league>` to re-check both.
# Config-as-DATA: scoring/structure live here, never in engine logic.

key = "sleeper_boyfun"
name = "BoyFun & Friends"
platform = "sleeper"
league_id = "1361543954771738624"
season = 2026
num_teams = 10

# Starting lineup (BN/IR excluded). 12 starters incl. SUPER_FLEX + DEF + ONE IDP_FLEX.
# Re-verified against the live league 2026-09-05, the morning of the draft: a DEF slot has
# APPEARED since the 2026-08-15 capture. Both live sources agree -- `roster_positions` now
# reads [... K, DEF, IDP_FLEX, BN x7] and draft settings read slots_def=1, slots_bn=7,
# rounds=19 = 12 + 7. The 2026-08-15 note said "the league carries no DEF slot"; that was
# true when written and is not true now. This is the SECOND time this league's roster has
# moved under the config, which is why `verify-scoring` runs before every draft.
starting_slots = ["QB", "RB", "RB", "WR", "WR", "WR", "TE", "FLEX", "SUPER_FLEX", "K", "DEF", "IDP_FLEX"]

median_match = true  # play H2H opponent AND league median
playoff_teams = 6
playoff_week_start = 15
trade_deadline_week = 13
waiver_type = "faab"
faab_budget = 100
notes = "Full redraft (max_keepers/draft_rounds treated as vestigial copy artifacts per owner)."
# Backtest verdict: raw VORP beats scarcity/VONA out-of-sample here.
# Re-run 2026-08-15 on the 2024->2025 fold against the CORRECTED 11-starter roster:
#   raw VORP       edge +28.7  (targets n=53 mean 197.6 vs fades n=72 mean 168.9)
#   scarcity/VONA  edge +20.1  (targets n=18 mean 199.4 vs fades n=110 mean 179.4)
# Verdict holds, but the margin is much thinner than the original +37-vs-+3 reading, which was
# measured under the wrong 4-IDP-slot structure. Treat this as "VORP, weakly" -- worth re-running
# if the roster changes again.
value_metric = "vorp"

# 19 rounds = 12 starters + slots_bn=7, from the live draft settings (2026-09-05).
draft_rounds = 19

# DELIBERATELY 0, and this is the one place the two leagues' value engines differ.
#
# League A really does draft 18 rounds against 11 starting slots (slots_bn=7), so bench
# depth belongs in its baseline too, and its board has the same D/ST-and-K inflation League
# B had. It is not switched on because the allocation rule, applied here, pushes QB
# replacement to QB36 -- and this pool holds ~32 real NFL starters, so QB36 projects 36
# points against QB20's 262. Measured: the board that produces is 13 quarterbacks in the top
# 15, which is the same junk-tail pathology already recorded against scarcity/VONA above.
#
# Superflex is what breaks it: SUPER_FLEX doubles QB starter demand to 20, and a
# demand-weighted bench then runs QB straight off the end of the position's real supply. A
# supply guard fixes it -- but every threshold that works is one I would be picking to make
# this league's board look right, so it is not going in five days before a draft in the
# OTHER league. League A does not draft this week. Re-open with a supply rule derived from
# something, not tuned to this.
replacement_bench_slots = 0

# Which Sleeper ADP market prices this league. `adp_idp` is the SUPERFLEX+IDP market and is
# the only field that covers offense and IDP on one scale (verified 2026-08-15: Josh Allen
# adp_idp 3.9 ~ adp_2qb 3.8, while adp_idp_1qb 19.5 ~ adp_half_ppr 23.1). Mixing markets by
# position produces incomparable ranks, so one league gets exactly one market.
adp_market = "adp_idp"

[slot_eligibility]
QB = ["QB"]
RB = ["RB"]
WR = ["WR"]
TE = ["TE"]
FLEX = ["RB", "WR", "TE"]
SUPER_FLEX = ["QB", "RB", "WR", "TE"]
K = ["K"]
DEF = ["DEF"]
IDP_FLEX = ["DL", "LB", "DB"]

