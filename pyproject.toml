[project]
name = "audible"
version = "0.1.0"
description = "Personal, league-aware fantasy football decision engine (Sleeper + ESPN + nflverse)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "fastmcp>=3.4.7",
    "feedparser>=6.0.14",
]

[project.optional-dependencies]
# nflverse adapter is isolated behind an extra so the deterministic core installs
# even where nflreadpy/polars wheels lag a new Python release.
nflverse = ["nflreadpy>=0.1.5"]

[project.scripts]
audible = "audible.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1",
    "playwright>=1.62.0",
]
# The defect-reproduction gates in sim/. A SEPARATE group, not part of `dev`, so
# `uv sync --no-dev` -- what the Dockerfile runs -- installs none of it and the runtime
# image carries no simulation dependencies.
#
# It is only pytest today because the gates are hand-built and offline: they import
# `audible` and nothing else. A season replay would add its dependencies HERE, which is
# the point of declaring the seam before there is anything to put in it.
sim = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audible"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# `testpaths` already keeps sim/ out of a bare `uv run pytest` -- it is not under tests/.
# `-m "not slow"` is the second, independent guard, so a future conftest or a rootdir
# change cannot quietly pull the gates into the run that has to stay fast for draft day.
#
# The gates are therefore run EXPLICITLY, and the later -m wins over this one:
#     uv run pytest sim -m slow
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
    "slow: defect-reproduction gates in sim/. Excluded from the default run.",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# Strict typing where correctness is load-bearing: the deterministic math.
# Adapters (I/O over untyped sports APIs) stay at standard to avoid fighting library Anys.
strict = [
    "src/audible/config",
    "src/audible/models",
    "src/audible/scoring",
    "src/audible/value",
    "src/audible/providers",
    "src/audible/crosswalk.py",
]
