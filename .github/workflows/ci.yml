name: ci

# Three PRs landed in this repo with no automated check, one of them carrying five commits
# nobody had reviewed. This is the cheap insurance: lint, types, tests, on every PR.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: tests/test_ui_desktop.py's negative control serves the PRE-FIX
      # page from `git show main:...` and asserts the new checks REJECT it. The default
      # depth-1 checkout has no main to read, and a negative control that cannot run is
      # worse than none -- it raises rather than skips, so this is load-bearing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --extra nflverse is deliberate. The suite is offline and every nflreadpy import in
      # src/ is lazy, so a plain `uv sync` would still pass -- but tests/test_snapshot.py
      # guards on `pytest.importorskip("polars")` and would SKIP three tests silently. A CI
      # job that quietly runs less than the local suite is worse than no CI, because it
      # reports green for a smaller claim than the one you think you're making.
      - run: uv sync --extra nflverse

      # `uv sync` installs the playwright PACKAGE but not the browser it drives, so the
      # first push of the desktop suite failed here with
      #   BrowserType.launch: Executable doesn't exist at .../chrome-headless-shell
      # on all ten tests -- 265 passed, 10 errors. --with-deps also pulls the system
      # libraries the headless shell needs on ubuntu-latest.
      - name: playwright browser
        run: uv run playwright install --with-deps chromium

      - name: ruff
        run: uv run ruff check .

      - name: pyright
        run: uv run pyright

      # AUDIBLE_UI_REQUIRED=1 is the whole point: with it, a missing browser is a hard
      # FAILURE, never a skip. A UI suite that passes by running nothing is the exact
      # failure mode that let an unclickable button ship green three times. `-rs` prints
      # the reason for any skip that does occur, so "green" is always auditable.
      - name: pytest
        env:
          AUDIBLE_UI_REQUIRED: "1"
        run: uv run pytest -rs

      # THE GATES THAT KEEP PAID DATA OUT OF A PUBLIC REMOTE HAD NEVER RUN ON A PR.
      # `testpaths = ["tests"]` and `-m "not slow"` both exclude sim/, so the step above
      # collects zero tests from it -- and three of the gates in this file exist to assert
      # that no subscription CSV is tracked anywhere in the repository. A gate that does not
      # run asserts nothing, which is the same failure the suite above was added to prevent.
      #
      # Scoped to this ONE file rather than all of sim/: the other gates there are
      # defect-reproduction gates with pinned-data dependencies CI does not carry, and a
      # step that fails for an unrelated reason is a step people learn to ignore. The gates
      # that read the gitignored corpus skip here and say so under -rs.
      - name: ffa scraper gates
        run: uv run pytest sim/test_g_ffa_scrape.py -m slow -rs
